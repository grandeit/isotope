name: Group-Sync Operator

on:
  push:
    paths:
      - "images/group-sync-operator/**"
      - ".github/workflows/group-sync-operator.yml"
      - ".github/workflows/build-isotopes.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
    - cron: "0 14 * * *" # Daily at 14:00 UTC

env:
  REGISTRY: ghcr.io

jobs:
  isotopes:
    uses: ./.github/workflows/build-isotopes.yml
    with:
      name: group-sync-operator
      isotopes: '["distroless", "ubi-micro", "ubi-minimal", "ubi"]'
      upstream_repo: redhat-cop/group-sync-operator
      upstream_version: "v0.0.36"
      build_stages_without_cache: ""
    permissions:
      contents: read
      actions: write
      packages: write
    secrets: inherit

  smoke-test:
    needs: isotopes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        isotope: ["distroless", "ubi-micro", "ubi-minimal", "ubi"]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/group-sync-operator:v0.0.36-${{ matrix.isotope }}-${{ github.run_id }}
    steps:
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull isotope image
        run: |
          docker pull ${{ env.IMAGE }}

      - name: Test if --help works for isotope
        run: |
          set -euo pipefail

          docker run --rm ${{ env.IMAGE }} --help 2>&1 | tee output.txt
          if [ ! -s output.txt ]; then
            echo "❌ ${{ matrix.isotope }} isotope called with --help produced no output"
            exit 1
          fi

          echo "✅ ${{ matrix.isotope }} isotope called with --help produced output"

  integration-test:
    needs: [isotopes, smoke-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        isotope: ["distroless", "ubi-micro", "ubi-minimal", "ubi"]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/group-sync-operator:v0.0.36-${{ matrix.isotope }}-${{ github.run_id }}
    steps:
      - name: Checkout upstream for CRDs
        uses: actions/checkout@v4
        with:
          repository: redhat-cop/group-sync-operator
          ref: v0.0.36
          path: upstream

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: test-${{ matrix.isotope }}

      - name: Load image into Kind
        run: |
          set -euo pipefail

          docker pull "${{ env.IMAGE }}"
          kind load docker-image "${{ env.IMAGE }}" --name test-${{ matrix.isotope }}

          echo "✅ Image loaded into Kind"

      - name: Install CRDs
        run: |
          set -euo pipefail

          kubectl apply -f upstream/config/crd/bases/
          kubectl wait --for=condition=established crd/groupsyncs.redhatcop.redhat.io --timeout=60s

          echo "✅ GroupSync CRD installed"

      - name: Deploy operator
        run: |
          set -euo pipefail

          kubectl create namespace group-sync-operator

          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: group-sync-operator
            namespace: group-sync-operator
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: group-sync-operator
          rules:
          - apiGroups: ["redhatcop.redhat.io"]
            resources: ["groupsyncs", "groupsyncs/status"]
            verbs: ["*"]
          - apiGroups: [""]
            resources: ["secrets", "configmaps"]
            verbs: ["get", "list", "watch"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: group-sync-operator
          subjects:
          - kind: ServiceAccount
            name: group-sync-operator
            namespace: group-sync-operator
          roleRef:
            kind: ClusterRole
            name: group-sync-operator
            apiGroup: rbac.authorization.k8s.io
          EOF

          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: group-sync-operator
            namespace: group-sync-operator
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: group-sync-operator
            template:
              metadata:
                labels:
                  app: group-sync-operator
              spec:
                serviceAccountName: group-sync-operator
                containers:
                - name: manager
                  image: ${{ env.IMAGE }}
                  imagePullPolicy: Never
                  args:
                  - --leader-elect=false
                  - --health-probe-bind-address=:8081
                  - --metrics-addr=:8080
                  ports:
                  - containerPort: 8081
                    name: health
                  - containerPort: 8080
                    name: metrics
                  livenessProbe:
                    httpGet:
                      path: /healthz
                      port: 8081
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /readyz
                      port: 8081
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  resources:
                    limits:
                      cpu: 200m
                      memory: 128Mi
                    requests:
                      cpu: 100m
                      memory: 64Mi
          EOF

          echo "✅ Operator deployment created"

      - name: Wait for operator to be ready
        run: |
          set -euo pipefail

          echo "Waiting for deployment..."
          for i in {1..60}; do
            echo "--- Attempt $i/60 ---"
            if kubectl wait --for=condition=available deployment/group-sync-operator \
              -n group-sync-operator --timeout=5s 2>/dev/null; then
              echo "✅ Operator deployment ready"
              exit 0
            fi

            if [[ $((i % 2)) -eq 0 ]]; then
              kubectl get pods -n group-sync-operator -o wide 2>/dev/null || true
            fi

            sleep 5
          done

          echo "❌ Deployment not ready after 5 minutes"
          kubectl describe pods -n group-sync-operator
          kubectl logs -l app=group-sync-operator -n group-sync-operator --tail=250 || true
          exit 1

      - name: Verify health endpoints
        run: |
          set -euo pipefail

          kubectl port-forward -n group-sync-operator deployment/group-sync-operator 8081:8081 &
          PF_PID=$!
          sleep 3

          curl -sf http://localhost:8081/healthz && echo " ✅ /healthz OK"
          curl -sf http://localhost:8081/readyz && echo " ✅ /readyz OK"

          kill $PF_PID 2>/dev/null || true

          echo "✅ Health endpoints responding"

      - name: Create GroupSync CR
        run: |
          set -euo pipefail

          kubectl apply -f - <<EOF
          apiVersion: redhatcop.redhat.io/v1alpha1
          kind: GroupSync
          metadata:
            name: test-groupsync
            namespace: group-sync-operator
          spec:
            providers: []
          EOF

          echo "✅ GroupSync CR created"

      - name: Verify reconciliation
        run: |
          set -euo pipefail

          echo "Waiting for reconciliation..."
          for i in {1..30}; do
            echo "--- Attempt $i/30 ---"
            LAST_SYNC=$(kubectl get groupsync test-groupsync -n group-sync-operator \
              -o jsonpath='{.status.lastSyncSuccessTime}' 2>/dev/null || echo "")

            if [[ -n "$LAST_SYNC" ]]; then
              echo "✅ Reconciliation completed at: $LAST_SYNC"
              break
            fi

            if [[ $((i % 2)) -eq 0 ]]; then
              echo "=== Operator logs ==="
              kubectl logs -l app=group-sync-operator -n group-sync-operator --tail=50
              echo "=== GroupSync CR ==="
              kubectl get groupsync test-groupsync -n group-sync-operator -o yaml
            fi

            if [[ $i -eq 30 ]]; then
              echo "❌ Reconciliation did not complete (status.lastSyncSuccessTime not set)"
              exit 1
            fi

            sleep 2
          done

          echo "=== GroupSync status ==="
          kubectl get groupsync test-groupsync -n group-sync-operator -o jsonpath='{.status}' | jq .

          kubectl get pods -n group-sync-operator | grep -q Running
          echo "✅ Operator processed the GroupSync CR successfully"

      - name: Test summary
        run: |
          echo "🎉 Integration test passed for ${{ matrix.isotope }} isotope"
          echo "  ✅ Operator starts successfully"
          echo "  ✅ Health endpoints respond"
          echo "  ✅ CRD reconciliation works"

  security-scan:
    needs: [isotopes, smoke-test, integration-test]
    uses: ./.github/workflows/security-scan.yml
    with:
      name: group-sync-operator
      isotopes: '["distroless", "ubi-micro", "ubi-minimal", "ubi"]'
      upstream_version: "v0.0.36"
      upstream_image: quay.io/redhat-cop/group-sync-operator
    permissions:
      contents: write
      packages: read
    secrets: inherit

  promote:
    needs: [isotopes, smoke-test, integration-test, security-scan]
    uses: ./.github/workflows/promote-isotopes.yml
    with:
      name: group-sync-operator
      isotopes: '["distroless", "ubi-micro", "ubi-minimal", "ubi"]'
      upstream_version: "v0.0.36"
    permissions:
      contents: write
      packages: write
    secrets: inherit
