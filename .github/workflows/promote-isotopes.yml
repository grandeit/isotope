name: Promote Isotopes

on:
  workflow_call:
    inputs:
      name:
        description: "Name of the image to promote"
        required: true
        type: string
      isotopes:
        description: "JSON array of isotopes to promote"
        required: true
        type: string
      upstream_version:
        description: "Upstream version tag"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  isotope:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        isotope: ${{ fromJson(inputs.isotopes) }}
    steps:
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote ${{ matrix.isotope }} isotope
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.name }}:${{ inputs.upstream_version }}-${{ matrix.isotope }} \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.name }}:${{ inputs.upstream_version }}-${{ matrix.isotope }}-${{ github.run_id }}

  report:
    needs: isotope
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout isotope repository
        uses: actions/checkout@v4

      - name: Download security report
        uses: actions/download-artifact@v4
        with:
          name: security-report
          path: .

      - name: Update images folder with security report
        env:
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail

          if [[ -f SECURITY.md ]]; then
            cp SECURITY.md "images/${NAME}/README.md"
            echo "✅ Updated images/${NAME}/README.md"
          else
            echo "❌ SECURITY.md not found"
            exit 1
          fi

      - name: Commit and push security report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(${{ inputs.name }}): update security report for ${{ inputs.upstream_version }}"
          file_pattern: "images/${{ inputs.name }}/README.md"
